[package]
name = "inquiSTR"
version = "0.19.0"
edition = "2021"
rust-version = "1.88.0"
authors = ["Wouter De Coster <wouter.decoster@gmail.com>"]
description = "A toolset to genotype and analyze STRs from long read sequencing data"
documentation = "https://github.com/wdecoster/inquiSTR"
homepage = "https://github.com/wdecoster/inquiSTR"
repository = "https://github.com/wdecoster/inquiSTR"
license = "MIT"
keywords = ["genomics", "str", "long-reads", "nanopore", "bioinformatics"]
categories = ["science", "command-line-utilities"]
include = [
    "src/**/*",
    "test-data/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE"
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
rust-htslib = { git = "https://github.com/wdecoster/rust-htslib.git" }
log = "0.4.28"
env_logger = "0.11.8"
bio = "3.0.0"
rayon = "1.11.0"
human-sort = "0.2.2"
flate2 = "1.1.5"
histo_fp = "0.2.1"
indicatif = { version = "0.18.3", features = ["rayon"] }
itertools = "0.14.0"
plotly = "0.13.5"
linfa-clustering = "0.8.0"
linfa = "0.8.0"
ndarray = "0.17.1"
dbscan = "0.3.1"
url = "2.5.7"
hts-sys = "2.2.0"
noodles-bgzf = "0.44.0"
regex = "1.12.2"
smallvec = "1.13.2"
reqwest = { version = "0.12.15", features = ["blocking", "json"] }
dirs = "6.0.0"
gag = "1.0.0"

[dev-dependencies]
ctor = "0.6.1"

# Optimization profiles
[profile.release]
lto = true              # Link-time optimization
codegen-units = 1       # Better optimization
panic = "abort"         # Smaller binaries, faster panic handling
strip = true            # Remove symbols for smaller binaries

[profile.dev]
# Faster builds in development
incremental = true

[profile.test]
# Inherit from dev but with optimizations for faster test runs
inherits = "dev"
opt-level = 1
