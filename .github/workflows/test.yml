name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/.ghcup
        df -h
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Cache cargo dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "build"
        save-if: ${{ github.ref == 'refs/heads/main' }}
    
    - name: Check formatting
      run: cargo fmt --check
      
    - name: Check clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
      
    - name: Build
      run: cargo build --verbose
      
    - name: Run tests
      run: cargo test --verbose

  test-musl:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/.ghcup
        df -h
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-musl
    
    - name: Install Cross
      run: cargo install cross --git https://github.com/cross-rs/cross
    
    - name: Cache cargo dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "musl"
        save-if: ${{ github.ref == 'refs/heads/main' }}
    
    - name: Build MUSL binary
      run: |
        OPENSSL_STATIC=1 \
        LIBZ_SYS_STATIC=1 \
        BZIP2_STATIC=1 \
        ZSTD_STATIC=1 \
        LZMA_API_STATIC=1 \
        CURL_STATIC=1 \
        cross build --target x86_64-unknown-linux-musl --verbose
    
    - name: Run tests on MUSL
      run: |
        OPENSSL_STATIC=1 \
        LIBZ_SYS_STATIC=1 \
        BZIP2_STATIC=1 \
        ZSTD_STATIC=1 \
        LZMA_API_STATIC=1 \
        CURL_STATIC=1 \
        cross test --target x86_64-unknown-linux-musl --verbose
    
    - name: Verify binary is static
      run: |
        file target/x86_64-unknown-linux-musl/debug/inquiSTR
        ldd target/x86_64-unknown-linux-musl/debug/inquiSTR || echo "Static binary confirmed"
